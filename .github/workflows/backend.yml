name: backend
on:
  pull_request:
    paths: ['backend/**']
  push:
    branches: [develop]
    paths: ['backend/**']
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  # deploy-dev runs on develop only; wire AWS OIDC role before enabling.
  # See DEVELOPER_BOOK.md §19.3.
